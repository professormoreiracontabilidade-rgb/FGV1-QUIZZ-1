<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 1 | Professor Moreira</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#315de3,#07164b 75%);color:white;font:18px system-ui;min-height:100vh}main{max-width:850px;margin:auto;padding:16px}header{text-align:center;font-weight:900;color:#ffe438;padding:14px;border:2px solid #ffe438;border-radius:18px}h1{font-size:clamp(30px,7vw,52px);color:#ffe438}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:13px;background:#ffe438;color:#07164b}button:disabled{opacity:.5}article{background:#fff;color:#10204a;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 0 #315de3}.bank{font-size:14px;font-weight:bold;color:#315de3}.stem,.opt{white-space:pre-wrap;overflow-wrap:anywhere}.opt{display:block;text-align:left;width:100%;margin:10px 0;background:#eaf0ff;color:#10204a;border:2px solid #315de3;font-weight:500}.opt:disabled{opacity:1;cursor:default}.right{background:#087b39!important;color:white!important;border-color:#087b39!important}.wrong{background:#c82039!important;color:white!important;border-color:#c82039!important}.nav{position:sticky;bottom:0;background:#07164b;padding:10px 0;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.nav button{flex:1}.ex{background:#e8f3ff;border-left:6px solid #315de3;padding:15px;border-radius:8px;line-height:1.6}.cover{text-align:center;padding:30px 8px}.bar{height:10px;background:#233b80;border-radius:10px;overflow:hidden}.bar i{display:block;background:#ffe438;height:100%}small{color:#dce6ff}</style><main><header>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</header><div id="app"></div></main><script>const Q=[{"n": 1, "bank": "FGV - OF CHAN (MRE)/MRE/2016", "stem": "Um dos objetivos da Contabilidade é o controle patrimonial, que se dá a partir do registro adequado dos fatos que\nalteram os seus elementos.\n\nNo controle do patrimônio, a riqueza líquida de uma entidade ao final de um período pode ser obtida pelo confronto de:", "opts": ["ativos, receitas e provisões;", "ativos e passivos financeiros;", "bens, direitos e obrigações;", "receitas e despesas;", "obrigações exigíveis e não exigíveis."], "key": 2, "ex": "Patrimônio líquido = bens + direitos − obrigações. Bens e direitos compõem o ativo; obrigações compõem o passivo exigível. Receitas e despesas apuram o resultado, não diretamente a riqueza líquida."}, {"n": 2, "bank": "FGV - TDP (DPE RO)/DPE RO/Técnico Administrativo/2025", "stem": "O Balanço Patrimonial é uma ferramenta fundamental para a análise da saúde financeira de uma empresa,\napresentando seus bens, direitos e obrigações de forma estruturada.\n\nA fórmula básica do Balanço Patrimonial é:", "opts": ["Ativo = Passivo + Patrimônio Líquido.", "Ativo = Passivo – Patrimônio líquido.", "Ativo = Patrimônio Líquido – Passivo.", "Patrimônio Líquido = Passivo X Ativo.", "Patrimônio Líquido = Ativo / Passivo."], "key": 0, "ex": "A equação patrimonial é A = P + PL. Isolando o PL, temos PL = A − P. O ativo representa aplicações; passivo e PL representam origens."}, {"n": 3, "bank": "FGV - Ana TI (DATAPREV)/DATAPREV/Gestão Econômico-Financeira/2024", "stem": "As noções básicas de contabilidade envolvem o registro, a classificação e a análise das transações financeiras de uma\norganização, fornecendo informações essenciais para a tomada de decisões econômicas e garantindo a transparência e a\nconformidade com normas contábeis. A principal função da contabilidade é", "opts": ["auxiliar na tomada de decisões e atender exclusivamente às exigências do governo.", "registrar apenas transações financeiras de pequeno porte.", "fornecer informações úteis para a tomada de decisões e registrar movimentações mensuráveis em relatórios.", "ajudar as empresas a evitarem o pagamento de impostos.", "gerar relatórios financeiros apenas para análise dos acionistas."], "key": 2, "ex": "A contabilidade registra, classifica e comunica informações úteis às decisões econômicas. Não atende exclusivamente ao governo ou aos acionistas, nem se limita a operações pequenas."}, {"n": 4, "bank": "FGV - Ana TI (DATAPREV)/DATAPREV/Gestão Econômico-Financeira/2024", "stem": "O Balanço Patrimonial é o principal relatório gerado pela Contabilidade, pois permite avaliar a saúde financeira e\neconômica da empresa em uma data específica, seja no final do ano ou em outro momento pré- determinado. O conjunto\nde bens e direitos controlados pela empresa denomina-se", "opts": ["passivo.", "capital social.", "leasing.", "ativo.", "capital próprio."], "key": 3, "ex": "Ativo é recurso econômico presente controlado pela entidade em decorrência de eventos passados. Passivo representa obrigações; capital próprio integra o PL."}, {"n": 5, "bank": "FGV - AGP (Pref Vitória)/Pref Vitória/Contador/2024", "stem": "Uma sociedade empresária apresentava os seguintes saldos em seu Balanço Patrimonial:\n\n       • Ativo Circulante: R$300.000;\n       • Passivo Circulante: R$150.000;\n       • Patrimônio Líquido: R$500.000.\n\nOs possíveis saldos para o Ativo não Circulante e o Passivo não Circulante são, respectivamente,", "opts": ["R$20.000 e R$30.000.", "R$100.000 e R$750.000.", "R$200.000 e R$50.000.", "R$400.000 e R$250.000.", "R$700.000 e R$350.000."], "key": 4, "ex": "300.000 + ANC = 150.000 + PNC + 500.000. Logo ANC − PNC = 350.000. Na alternativa E, 700.000 − 350.000 = 350.000."}, {"n": 6, "bank": "FGV - Inv Pol (PC AM)/PC AM/4ª Classe/2022", "stem": "O objeto da Contabilidade é o patrimônio, que é formado pelos ativos e pelos passivos.\n\nAssinale a afirmativa correta sobre os ativos e os passivos de uma entidade.", "opts": ["Os ativos representam os bens, e os passivos, as obrigações e os direitos.", "Os ativos se referem à posição financeira, e os passivos, ao desempenho financeiro.", "Os ativos são evidenciados em ordem de liquidez, e os passivos, em ordem de solvência.", "Os ativos são mensurados de acordo com o valor justo, e os passivos, de acordo com o custo histórico.", "Os ativos mostram como são aplicados os recursos da entidade, e os passivos, quais as origens dos recursos."], "key": 4, "ex": "Ativo representa aplicações de recursos. O lado direito do balanço evidencia suas origens, próprias (PL) e de terceiros (passivo). A alternativa E usa passivo em sentido amplo."}, {"n": 7, "bank": "FGV - Ag Pol (RN)/PC RN/2021", "stem": "A referência à riqueza líquida de uma entidade pode ser associada:", "opts": ["à sua capacidade de liquidez imediata;", "ao montante de ativos realizáveis no exercício financeiro;", "aos valores liquidados com capital próprio;", "ao montante dos ativos deduzido dos passivos;", "ao capital social liquidado pelos proprietários."], "key": 3, "ex": "Riqueza líquida = ativo − passivo exigível = patrimônio líquido. Não se confunde com caixa ou capital social."}, {"n": 8, "bank": "FGV - Ass Adm (TCE-PI)/TCE PI/2021", "stem": "Os registros de operações realizadas em uma empresa têm o objetivo de gerar informações úteis para a gestão\norganizacional.\n\nEmbora seja fornecida uma diversidade de informações nos relatórios contábeis, o objeto da contabilidade é o:", "opts": ["controle de receitas e despesas;", "fluxo de caixa das entidades;", "lucro das entidades;", "patrimônio das entidades;", "valor de mercado das entidades."], "key": 3, "ex": "O objeto da contabilidade é o patrimônio das entidades. Controle e fornecimento de informações são objetivos; lucro e caixa são aspectos do patrimônio."}, {"n": 9, "bank": "FGV - Tec (FunSaúde CE)/FunSaúde CE/Contabilidade/2021", "stem": "Uma entidade apresenta passivo a descoberto.\n\nEm relação à equação fundamental nesta entidade, assinale a opção correta.", "opts": ["Passivo = Patrimônio Líquido – Ativo.", "Passivo = Ativo + Patrimônio Líquido.", "Patrimônio Líquido = Ativo + Passivo.", "Ativo = Patrimônio Líquido – Passivo.", "Ativo + Passivo + Patrimônio Líquido = 0."], "key": 1, "ex": "Passivo a descoberto significa PL negativo. Exemplo: A = 80, P = 100, PL = −20. Assim P = A + 20. A banca usa PL como magnitude positiva do déficit na alternativa B; algebricamente, com PL sinalizado, P = A − PL."}, {"n": 10, "bank": "FGV - Ana EF (BANESTES)/BANESTES/Gestão Financeira/2018", "stem": "Ao analisar diversos Balanços Patrimoniais de empresas, um analista percebe que tanto o lado esquerdo como o lado\ndireito desse tipo de relatório contábil sempre apresentam o mesmo total em unidades monetárias.\n\nUma maneira de entender essa constatação é que tanto as aplicações como as origens de recursos da empresa são sempre\nretratadas, respectivamente, como:", "opts": ["“Ativo” e “Passivo + Patrimônio Líquido”;", "“Passivo + Patrimônio Líquido” e “Ativo”;", "“Patrimônio Líquido” e “Ativo”;", "“Patrimônio Líquido” e “Passivo”;", "“Passivo” e “Patrimônio Líquido”."], "key": 0, "ex": "Aplicações = ativo. Origens = passivo exigível + patrimônio líquido. A igualdade decorre da equação patrimonial."}], K='moreira-basica-2026-1';let st={i:-1,a:{}};try{st=JSON.parse(localStorage.getItem(K))||st}catch(e){}const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}function go(i){st.i=i;save();render();window.scrollTo(0,0)}function reset(){if(confirm('Reiniciar este quiz e apagar as respostas?')){st={i:-1,a:{}};save();render()}}function sound(ok){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:180;g.gain.value=.12;o.start();o.stop(c.currentTime+.25);o.onended=()=>c.close()}catch(e){}}function answer(j){if(st.a[st.i]!==undefined)return;st.a[st.i]=j;save();sound(j===Q[st.i].key);render();document.getElementById('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}function render(){let count=Object.keys(st.a).length,score=Q.filter((q,i)=>st.a[i]===q.key).length;if(st.i<0){app.innerHTML=`<section class="cover"><h1>TREINAMENTO PESADO</h1><h2>CONTABILIDADE BÁSICA • FGV</h2><h2>QUIZ 1 — 10 QUESTÕES</h2><p>Quem quer ser aprovado estuda, quem não quer arranja desculpa.</p><button onclick="go(0)">Começar treinamento</button></section>`;return}if(st.i>=10){app.innerHTML=`<section class="cover"><h1>RESULTADO</h1><h2>${score} / 10 acertos</h2><p>${count-score} erros • ${10-count} não respondidas</p><button onclick="go(0)">Revisar questões</button> <button onclick="reset()">Reiniciar</button></section>`;return}let q=Q[st.i],a=st.a[st.i],done=a!==undefined;app.innerHTML=`<p>QUIZ 1 • Questão ${st.i+1} de 10 <small> | Acertos: ${score} | Erros: ${count-score}</small></p><div class="bar"><i style="width:${count*10}%"></i></div><article><div class="bank">${esc(q.bank)}</div><h3>Questão ${q.n} da apostila</h3><div class="stem">${esc(q.stem)}</div>${q.opts.map((o,j)=>`<button class="opt ${done&&j===q.key?'right':done&&j===a?'wrong':''}" ${done?'disabled':''} onclick="answer(${j})">${String.fromCharCode(65+j)}) ${esc(o)}</button>`).join('')}${done?`<div id="feedback"><h3 style="color:${a===q.key?'#087b39':'#c82039'}">${a===q.key?'✓ ACERTOU!':'✗ ERROU!'} — Gabarito: ${String.fromCharCode(65+q.key)}</h3><div class="ex"><strong>MÉTODO PROF. MOREIRA — RESOLUÇÃO</strong><p>${esc(q.ex)}</p></div></div>`:''}</article><div class="nav"><button onclick="go(${st.i-1})">← Voltar</button><button onclick="reset()">Reiniciar</button><button onclick="go(${st.i+1})" ${done?'':'disabled'}>${st.i===9?'Resultado':'Avançar →'}</button></div>`}render();</script></html>
